<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CodeLove Games">
  <rect width="32" height="32" rx="8" fill="#ff7a33"/>
  <!-- Controller body plus two grips, unioned by overlap. Solid fills only,
       so the mark survives down to 16px with no anti-aliased hairlines. -->
  <g fill="#0b0c0e">
    <rect x="3" y="8.5" width="26" height="11" rx="5.5"/>
    <rect x="3" y="13.5" width="8.5" height="10" rx="4.25"/>
    <rect x="20.5" y="13.5" width="8.5" height="10" rx="4.25"/>
  </g>
  <!-- D-pad, knocked out in the tile colour. -->
  <g fill="#ff7a33">
    <rect x="8.85" y="9.4" width="2.9" height="8.4" rx="0.7"/>
    <rect x="6.1" y="12.15" width="8.4" height="2.9" rx="0.7"/>
  </g>
  <!-- Action buttons knock back out of the dark body. -->
  <g fill="#f5f6f8">
    <circle cx="20.9" cy="15.7" r="2"/>
    <circle cx="24.7" cy="11.9" r="2"/>
  </g>
</svg>
